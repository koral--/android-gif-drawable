plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}

group = 'pl.droidsonroids.gif'
description = 'Views and Drawable for displaying animated GIFs for Android'

android {
    namespace = 'pl.droidsonroids.gif'
    testNamespace = 'pl.droidsonroids.gif.test'
    ndkVersion = libs.versions.ndk.get()
    compileSdk = libs.versions.compileSdk.get().toInteger()
    // No Kotlin sources, so no Kotlin stdlib dependency in the POM
    enableKotlin = false

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        consumerProguardFiles 'consumer-proguard-rules.pro'
        // AGP 9 defaults it to our compileSdk, but consumers can compile against any SDK down to minSdk
        aarMetadata {
            minCompileSdk = libs.versions.minSdk.get().toInteger()
        }
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                version = libs.versions.cmake.get()
                arguments "-DANDROID_PLATFORM=android-${libs.versions.minSdk.get()}", "-DANDROID_STL=none"
                cFlags '-std=c11', '-Weverything', '-Wall'
                if (isDevelopmentBuild()) {
                    cFlags '-DDEBUG', '-g'
                } else {
                    cFlags '-DNDEBUG', '-Os', '-g0', '-fvisibility=hidden'
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = 'src/main/c/CMakeLists.txt'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.relinker
    compileOnly libs.androidx.annotation
    testCompileOnly libs.androidx.annotation
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.assertj.core
    testImplementation libs.concurrentunit
    testImplementation libs.opengl.api
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.runner
    androidTestCompileOnly libs.androidx.annotation
}

def isDevelopmentBuild() {
    return project.findProperty('android.injected.invoked.from.ide') == 'true'
}

tasks.register('archiveSymbols', Tar) {
    def buildDirectory = layout.buildDirectory.asFile.get()
    from new File(buildDirectory, 'intermediates/cmake/release/obj')
    archiveBaseName = "symbols"
    destinationDirectory = new File(buildDirectory, 'libs')
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
}

configurations.configureEach {
    resolutionStrategy.force libs.androidx.annotation.get().toString()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
}
