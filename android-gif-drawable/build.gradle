import com.android.build.api.artifact.SingleArtifact
import kotlinx.validation.KotlinApiBuildTask
import kotlinx.validation.KotlinApiCompareTask

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}

group = 'pl.droidsonroids.gif'
description = 'Views and Drawable for displaying animated GIFs for Android'

android {
    namespace = 'pl.droidsonroids.gif'
    testNamespace = 'pl.droidsonroids.gif.test'
    ndkVersion = libs.versions.ndk.get()
    compileSdk = libs.versions.compileSdk.get().toInteger()
    // No Kotlin sources, so no Kotlin stdlib dependency in the POM
    enableKotlin = false

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        consumerProguardFiles 'consumer-proguard-rules.pro'
        // AGP 9 defaults it to our compileSdk, but consumers can compile against any SDK down to minSdk
        aarMetadata {
            minCompileSdk = libs.versions.minSdk.get().toInteger()
        }
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-${libs.versions.minSdk.get()}", "-DANDROID_STL=none"
                cFlags '-std=c11', '-Weverything', '-Wall'
                if (isDevelopmentBuild()) {
                    cFlags '-DDEBUG', '-g'
                } else {
                    // Optimization and debug info come from the CMake build type, flags set here are overridden by it.
                    // Release builds are RelWithDebInfo (-O2 -g), the debug info goes to the symbols archive
                    // and is stripped from the AAR.
                    cFlags '-DNDEBUG', '-fvisibility=hidden'
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = 'src/main/c/CMakeLists.txt'
            version = libs.versions.cmake.get()
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.relinker
    compileOnly libs.androidx.annotation
    testCompileOnly libs.androidx.annotation
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.assertj.core
    testImplementation libs.concurrentunit
    testImplementation libs.opengl.api
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.runner
    androidTestCompileOnly libs.androidx.annotation
}

def isDevelopmentBuild() {
    return project.findProperty('android.injected.invoked.from.ide') == 'true'
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        // Unstripped native libraries for symbolicating native crashes, attached to GitHub releases
        tasks.register('archiveSymbols', Tar) {
            from variant.artifacts.get(SingleArtifact.MERGED_NATIVE_LIBS.INSTANCE).map { it.dir('lib') }
            archiveBaseName = 'android-gif-drawable-symbols'
            archiveVersion = providers.gradleProperty('VERSION_NAME')
            destinationDirectory = layout.buildDirectory.dir('outputs/native-debug-symbols')
            archiveExtension = 'tar.gz'
            compression = Compression.GZIP
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}

// The binary compatibility validator configures itself only for Kotlin modules, so its tasks are registered here
def apiFile = layout.projectDirectory.file('api/android-gif-drawable.api')
def apiBuild = tasks.register('apiBuild', KotlinApiBuildTask) {
    inputClassesDirs.from(tasks.named('compileReleaseJavaWithJavac').flatMap { it.destinationDirectory })
    outputApiFile = layout.buildDirectory.file('api/android-gif-drawable.api')
}
def apiCheck = tasks.register('apiCheck', KotlinApiCompareTask) {
    group = 'verification'
    description = 'Checks the public API against api/android-gif-drawable.api'
    projectApiFile = apiFile
    generatedApiFile = apiBuild.flatMap { it.outputApiFile }
}
tasks.register('apiDump', Copy) {
    description = 'Updates api/android-gif-drawable.api with the current public API'
    from apiBuild.flatMap { it.outputApiFile }
    into apiFile.asFile.parentFile
}
tasks.named('check') {
    dependsOn apiCheck
}

configurations.configureEach {
    resolutionStrategy.force libs.androidx.annotation.get().toString()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
}
