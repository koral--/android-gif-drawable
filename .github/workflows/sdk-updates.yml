name: SDK updates

# Dependabot does not update the NDK, CMake and compile SDK, so newer stable versions are reported in an issue
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Android SDK updates
    if: github.repository == 'koral--/android-gif-drawable'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Report newer NDK, CMake and compile SDK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/sdk-updates.js
