name: Set up Android build
description: Installs the JDK and the NDK and CMake versions declared in build.gradle

runs:
  using: composite
  steps:
    # Validation only, setup-gradle is intentionally not used (its caching component has proprietary license terms)
    - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Install NDK and CMake
      shell: bash
      run: |
        ndk=$(sed -nE "s/^[[:space:]]*ndk[[:space:]]*:[[:space:]]*'([^']+)'.*/\1/p" build.gradle)
        cmake=$(sed -nE "s/^[[:space:]]*cmake[[:space:]]*:[[:space:]]*'([^']+)'.*/\1/p" build.gradle)
        if [ -z "$ndk" ] || [ -z "$cmake" ]; then
          echo "::error::Could not read the NDK and CMake versions from build.gradle"
          exit 1
        fi
        echo "Installing NDK $ndk and CMake $cmake"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null
