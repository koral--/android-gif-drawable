name: Set up Android build
description: Installs the JDK and the NDK and CMake versions declared in the version catalog

runs:
  using: composite
  steps:
    # Validation only, setup-gradle is intentionally not used (its caching component has proprietary license terms)
    - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Install NDK and CMake
      shell: bash
      run: |
        ndk=$(sed -nE 's/^ndk[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
        cmake=$(sed -nE 's/^cmake[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
        if [ -z "$ndk" ] || [ -z "$cmake" ]; then
          echo "::error::Could not read the NDK and CMake versions from gradle/libs.versions.toml"
          exit 1
        fi
        echo "Installing NDK $ndk and CMake $cmake"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null
